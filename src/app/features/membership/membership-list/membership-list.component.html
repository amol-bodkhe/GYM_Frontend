<h2>Memberships</h2>
<table>
  <tbody>
  <tr>
    <th>ID</th><th>User ID</th><th>Plan</th><th>Start Date</th><th>End Date</th>
    <th>Amount</th></tr>
  <tr *ngFor="let item of memberships">
     <td>{{item._id}}</td>
     <td>{{item.userId}}</td>
     <td>{{item.plan}}</td>
     <td>{{item.startDate}}</td>
     <td>{{item.endDate}}</td>
     <td>{{item.amount}}</td>
  </tr>
  </tbody>
</table>
